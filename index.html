<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RISVA AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CINEMATIC BACKGROUND -->

    <div class="cinema-bg">

        <div class="film-reel reel-left"></div>

        <div class="spotlight spotlight-one"></div>

        <div class="spotlight spotlight-two"></div>

        <div class="clapper">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="film-strip"></div>

    </div>


    <!-- MAIN -->

    <main class="page">

        <section class="login-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-symbol">
                    R
                </div>

                <div>

                    <h1>
                        RISVA <span>AI</span>
                    </h1>

                    <p>
                        From Idea → Story → Screen
                    </p>

                </div>

            </div>


            <p class="description">
                A Creative AI Platform for Cinema & Storytelling
            </p>


            <!-- CREATOR SECTION -->

            <div class="creator-section">


                <!-- LOGO -->

                <div class="profile-item">

                    <div
                        class="photo-circle logo-circle"
                        id="logoBox"
                    >

                        <span
                            id="logoPlus"
                            class="plus"
                        >
                            +
                        </span>

                        <img
                            id="logoPreview"
                            alt="RISVA Logo"
                        >

                        <input
                            type="file"
                            id="logoInput"
                            accept="image/*"
                            hidden
                            onchange="uploadLogo(event)"
                        >

                    </div>


                    <button
                        class="upload-label"
                        id="logoUploadButton"
                        onclick="openLogoUpload()"
                    >
                        + Upload Logo
                    </button>

                </div>



                <!-- FOUNDER -->

                <div class="profile-item">

                    <div
                        class="photo-circle founder-circle"
                        id="founderBox"
                    >

                        <span
                            id="founderPlus"
                            class="plus"
                        >
                            +
                        </span>

                        <img
                            id="founderPreview"
                            alt="Founder Photo"
                        >

                        <input
                            type="file"
                            id="founderInput"
                            accept="image/*"
                            hidden
                            onchange="uploadFounder(event)"
                        >

                    </div>


                    <button
                        class="upload-label"
                        id="founderUploadButton"
                        onclick="openFounderUpload()"
                    >
                        + Founder Photo
                    </button>

                </div>


            </div>


            <!-- VIEW INFORMATION -->

            <div class="creator-info">

                <h3>
                    RISVA AI
                </h3>

                <p>
                    Creative Platform
                </p>

                <span>
                    Stories • Cinema • Creativity
                </span>

            </div>



            <!-- LOGIN -->

            <div class="login-form">


                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            autocomplete="username"
                        >

                    </div>

                </div>



                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                        >

                        <button
                            class="eye"
                            onclick="togglePassword()"
                            type="button"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <button
                    class="login-button"
                    onclick="login()"
                >

                    <span>
                        LOGIN
                    </span>

                    <strong>
                        →
                    </strong>

                </button>


            </div>



            <!-- OWNER -->

            <div class="owner-control">

                <button
                    class="owner-button"
                    onclick="ownerLogin()"
                >
                    ⚙ Owner Mode
                </button>

            </div>



            <!-- FOOTER -->

            <div class="footer">

                <p>
                    Create • Write • Imagine • Inspire
                </p>

                <span>
                    RISVA AI — Creative Platform
                </span>

            </div>


        </section>

    </main>


    <!-- OWNER MODAL -->

    <div
        class="modal"
        id="ownerModal"
    >

        <div class="modal-card">

            <button
                class="close"
                onclick="closeOwnerModal()"
            >
                ×
            </button>

            <h2>
                Owner Mode
            </h2>

            <p>
                Owner password enter pannunga.
            </p>

            <input
                type="password"
                id="ownerPassword"
                placeholder="Owner Password"
            >

            <button
                onclick="activateOwner()"
            >
                Activate
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
